name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  connector:
    name: MT5 connector tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r connector/requirements-dev.txt
      - name: Run connector tests (fake MT5 + shared vectors)
        working-directory: connector
        run: python -m pytest -q

  database:
    name: Database RLS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations to a throwaway PostgreSQL and run RLS tests
        run: bash scripts/test-rls.sh
